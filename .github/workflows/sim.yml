name: sim
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: pip install -r requirements.txt
      - name: belt bench
        run: make -C tb DUT=axis_passthrough
      - name: skid bench
        run: make -C tb DUT=axis_skid
      - name: eth bench
        run: make -C tb DUT=eth_parser
      - name: ipv4 bench
        run: make -C tb DUT=ipv4_parser
      - name: udp bench
        run: make -C tb DUT=udp_parser
      - name: l1 bench
        run: make -C tb DUT=l1_trigger
      - name: top bench
        run: make -C tb DUT=parser_top
      - name: fuzz
        run: make -C tb DUT=parser_top COCOTB_TEST_MODULES=test_fuzz
      - name: fpga_top sim
        run: make -C tb DUT=fpga_top COCOTB_TEST_MODULES=test_fpga_top 
